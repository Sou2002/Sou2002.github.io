<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects | Sourav Banerjee</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <nav>
            <a href="../index.html" class="logo">Sourav Banerjee</a>
            
            <button class="menu-toggle" aria-label="Toggle Navigation">
                <i class="fa-solid fa-bars"></i>
            </button>

            <div class="nav-links">
                <a href="about.html">About Me</a>
                <a href="blogs.html">Blogs</a>
                <a href="projects.html">Projects</a>
                <a href="socials.html">Socials</a>
            </div>
        </nav>
    </header>

    <main class="page-content">
        <div class="page-header">
            <h1>My Projects</h1>
            <p class="page-intro">A collection of my machine learning experiments, projects, and open-source contributions.</p>
        </div>

        <div class="projects-grid" id="github-projects">
            <p style="color: var(--muted); text-align: center; grid-column: 1 / -1;">Loading projects...</p>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Sourav Banerjee. All rights reserved.</p>
    </footer>

    <script>
        const githubUsername = 'Sou2002'; 
        
        const curatedProjects = [
            { 
                repoName: 'corporate-researcher', 
                displayName: 'Corporate Researcher' 
            },
            { 
                repoName: 'sir_implementation', 
                displayName: 'Parameter Optimization of S-I-R Epidemic Model'
            },
            { 
                repoName: 'customer-sql-agent', 
                displayName: 'AI Agent for Store Customer Database'
            },
            { 
                repoName: 'mushroom_classification', 
                displayName: 'Mushroom Classification'
            },
            { 
                repoName: 'face_verification', 
                displayName: 'Face Verification using Siamese Neural Network'
            },
            { 
                repoName: 'real_estate_price_prediction', 
                displayName: 'Real Estate Price Prediction'
            },
            { 
                repoName: 'yokit_chatbot', 
                displayName: 'Yokit Chatbot'
            }
        ];

        const projectsContainer = document.getElementById('github-projects');

        Promise.all(
            curatedProjects.map(project => 
                fetch(`https://api.github.com/repos/${githubUsername}/${project.repoName}`)
                    .then(response => {
                        if (!response.ok) {
                            console.warn(`Could not fetch: ${project.repoName}`);
                            return null;
                        }

                        return response.json().then(data => {
                            data.customDisplayName = project.displayName;
                            return data;
                        });
                    })
            )
        )
        .then(repos => {
            const validRepos = repos.filter(repo => repo !== null);

            if (validRepos.length > 0) {
                projectsContainer.innerHTML = '';

                validRepos.forEach(repo => {
                    const autoTitle = repo.name.replace(/-/g, ' ').replace(/_/g, ' ');
                    const fallbackTitle = autoTitle.charAt(0).toUpperCase() + autoTitle.slice(1);
                    
                    const finalTitle = repo.customDisplayName ? repo.customDisplayName : fallbackTitle;
                    
                    const description = repo.description || "No description provided on GitHub.";

                    let tagsHtml = '';
                    const tags = [];
                    if (repo.language) tags.push(repo.language);
                    if (repo.topics && repo.topics.length > 0) tags.push(...repo.topics);
                    
                    const displayTags = tags.slice(0, 3);
                    if (displayTags.length > 0) {
                        tagsHtml = `<div class="project-tags">
                            ${displayTags.map(tag => `<em>${tag}</em>`).join('')}
                        </div>`;
                    }

                    let liveDemoHtml = '';
                    if (repo.homepage) {
                        liveDemoHtml = `<a href="${repo.homepage}" target="_blank" aria-label="Live Demo"><i class="fa-solid fa-arrow-up-right-from-square"></i></a>`;
                    }

                    const projectCard = `
                        <div class="project-card">
                            <div class="project-header">
                                <i class="fa-solid fa-code-branch project-icon"></i>
                                <div class="project-links">
                                    <a href="${repo.html_url}" target="_blank" aria-label="GitHub Repository"><i class="fa-brands fa-github"></i></a>
                                    ${liveDemoHtml}
                                </div>
                            </div>
                            <h2 class="project-title">${finalTitle}</h2>
                            <p class="project-description">${description}</p>
                            ${tagsHtml}
                            
                            <a href="project-details.html?repo=${repo.name}&title=${encodeURIComponent(finalTitle)}" class="btn-read-more">
                                View Details <i class="fa-solid fa-arrow-right"></i>
                            </a>
                        </div>
                    `;

                    projectsContainer.innerHTML += projectCard;
                });
            } else {
                projectsContainer.innerHTML = '<p style="color: var(--muted); text-align: center; grid-column: 1 / -1;">No projects configured yet.</p>';
            }
        })
        .catch(error => {
            console.error("Error fetching GitHub repos:", error);
            projectsContainer.innerHTML = '<p style="color: var(--muted); text-align: center; grid-column: 1 / -1;">Failed to load projects. Please check my GitHub profile directly.</p>';
        });
    </script>
</body>
</html>
