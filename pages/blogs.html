<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blogs | Sourav Banerjee</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <header>
        <nav>
            <a href="../index.html" class="logo">Sourav Banerjee</a>
            
            <button class="menu-toggle" aria-label="Toggle Navigation">
                <i class="fa-solid fa-bars"></i>
            </button>

            <div class="nav-links">
                <a href="about.html">About Me</a>
                <a href="blogs.html">Blogs</a>
                <a href="projects.html">Projects</a>
                <a href="socials.html">Socials</a>
            </div>
        </nav>
    </header>

    <main class="page-content">
        <div class="page-header">
            <h1>My Blogs</h1>
            <p class="page-intro">Thoughts, tutorials, and deep dives into Machine Learning, algorithms, and the math that makes it all work.</p>
        </div>

        <div class="blogs-list">

            <div class="blogs-list" id="substack-feed">
                <p style="color: var(--muted); text-align: center;">Loading latest posts from Substack...</p>
            </div>

        </div>
    </main>

    <footer>
        <p>&copy; 2026 Sourav Banerjee. All rights reserved.</p>
    </footer>

    <script>
        const substackUsername = 'sou2002'; 
        
        const rssUrl = `https://${substackUsername}.substack.com/feed`;
        const apiUrl = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(rssUrl)}`;
        const feedContainer = document.getElementById('substack-feed');

        fetch(apiUrl)
            .then(response => response.json())
            .then(data => {
                if (data.status === 'ok' && data.items.length > 0) {
                    feedContainer.innerHTML = '';

                    const posts = data.items.slice(0, 5); 

                    posts.forEach(post => {
                        const pubDate = new Date(post.pubDate);
                        const formattedDate = pubDate.toLocaleDateString('en-US', { 
                            year: 'numeric', 
                            month: 'long', 
                            day: 'numeric' 
                        });

                        const tempDiv = document.createElement("div");
                        tempDiv.innerHTML = post.description;
                        let snippet = tempDiv.textContent || tempDiv.innerText || "";
                        snippet = snippet.substring(0, 120) + '...';

                        let tagsHtml = '';
                        if (post.categories && post.categories.length > 0) {
                            tagsHtml = `<div class="blog-tags">
                                ${post.categories.map(tag => `<em>${tag}</em>`).join('')}
                            </div>`;
                        }

                        const blogCard = `
                            <a href="${post.link}" target="_blank" class="blog-card">
                                <div class="blog-meta">
                                    <time datetime="${post.pubDate}">${formattedDate}</time>
                                </div>
                                <h2 class="blog-title">${post.title}</h2>
                                <p class="blog-excerpt">${snippet}</p>
                                ${tagsHtml}
                            </a>
                        `;

                        feedContainer.innerHTML += blogCard;
                    });
                } else {
                    feedContainer.innerHTML = '<p style="color: var(--muted); text-align: center;">No posts found right now.</p>';
                }
            })
            .catch(error => {
                console.error("Error fetching Substack feed:", error);
                feedContainer.innerHTML = '<p style="color: var(--muted); text-align: center;">Failed to load posts. Please check back later.</p>';
            });
    </script>
</body>
</html>
